name: dev-test-with-db

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  test:
    name: Test with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESERVATION_SERVICE_POSTGRES_USER: ci_user
      RESERVATION_SERVICE_POSTGRES_PASSWORD: ci_password
      RESERVATION_SERVICE_POSTGRES_DB: bus_reservation_ci
      RESERVATION_SERVICE_POSTGRES_PORT: "55432"
      ConnectionStrings__DefaultConnection: >-
        Host=localhost;
        Port=55432;
        Database=bus_reservation_ci;
        Username=ci_user;
        Password=ci_password;

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore BusReservationService.slnx

      - name: Start database
        run: docker compose up --detach --wait --wait-timeout 60 db

      - name: Run tests
        run: dotnet test BusReservationService.slnx --configuration Release --no-restore

      - name: Show database diagnostics
        if: failure()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color db || true

      - name: Stop database
        if: always()
        run: docker compose down --volumes --remove-orphans
