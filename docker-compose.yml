services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: >-
        Host=db;
        Port=5432;
        Database=${RESERVATION_SERVICE_POSTGRES_DB};
        Username=${RESERVATION_SERVICE_POSTGRES_USER};
        Password=${RESERVATION_SERVICE_POSTGRES_PASSWORD};
    ports:
      - "${RESERVATION_SERVICE_API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RESERVATION_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RESERVATION_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RESERVATION_SERVICE_POSTGRES_DB}
    ports:
      - "${RESERVATION_SERVICE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Infra/Database/Migrations/20260911084734_init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    image: redis:8-alpine
    container_name: redis_container
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
