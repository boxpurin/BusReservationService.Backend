services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${RESERVATION_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RESERVATION_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RESERVATION_SERVICE_POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: